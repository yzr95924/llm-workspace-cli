name: test

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.20
      - run: ruff format --check .
      - run: ruff check .
      # skill↔CLI 外部契约 gate：skill 文本里的 llmw 命令/flag/finding 名/终态词 与
      # CLI argparse 树 + finding 字面量比对，CLI 代码里的 rule_ref 指针与 skill 小节
      # 比对——语法面漂移即红（语义面行为描述靠 MEMORY 纪律人工保证）。
      - run: python scripts/test/check_skill_cli_contract.py
      # skill 零代码不变量：yzr-llm-*/ 下不得出现 .py（确定性代码全部归 llmw/content/）。
      # 两 SKILL 目录是纯文本（SKILL.md / 模板 / fixtures / workflow 散文）——代码回渗即红。
      - run: |
          find yzr-llm-wiki-management yzr-llm-workspace-management -name '*.py' | grep -q . && { echo 'FAIL: skill 目录出现 .py'; exit 1; } || true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.7 不在 setup-python 的 ubuntu-24.04（=ubuntu-latest）镜像里；ubuntu-22.04
        # 虽有但 2026-09 起弃用。改用官方 python 容器提供真实 3.7/3.11 环境，不受
        # runner 镜像变动影响。用 full 镜像（非 -slim）：3.7 基于 Debian Buster，
        # 其 apt 仓库已归档下线（404），slim 需手动改源装 git；full 自带 git。
        # 代码按 py37 语法安全写成，3.7 证明向后兼容，3.11 覆盖现代。
        py: ["3.7", "3.11"]
    container: python:${{ matrix.py }}
    steps:
      - uses: actions/checkout@v4
      # 不装 [dev]（含 ruff）：ruff 在 3.7 上装不干净；lint 已由 lint job 覆盖。
      # 钉 pytest<8：pytest 8 要求 py>=3.8。（不装 pytest-cov：无 --cov 用例，纯多余依赖）
      - run: pip install -e . "pytest>=7,<8"
      # import smoke：逐一 import 所有子模块——这才是 3.7 矩阵的真实价值。它能抓到
      # import 期求值的注解破坏（如只在 3.9+ 可用的 dict[str,str]）；而 pytest 只 import
      # 被收集的测试文件，覆盖不到 llmw 全部子模块。
      - run: python -c "import importlib,pkgutil,llmw; [importlib.import_module(m.name) for m in pkgutil.walk_packages(llmw.__path__,'llmw.')]; print('import smoke OK')"
      # 全仓 pytest：tests/（含搬入的 llmw.content 测试）。
      - run: pytest -q

  # fresh init + wiki → 两探测器（llmw.content 命令面：`llmw check-fixtures` /
  # `llmw wiki --path=DIR check-fixtures`）→ 断言结构合规。
  # 双向覆盖：CLI 改坏骨架 / 两 SKILL 改坏 fixtures 都让本 job 红。兑现
  # 探测器作为「CLI 产物合规的可执行真源」（格式契约与探测器不一致时以探测器为准）。
  # 两 SKILL 与 CLI 同仓，无 submodule 依赖。
  fixtures-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 不需 pip install：gate 脚本内设 PYTHONPATH=REPO，python -m llmw 直接 import。
      - run: python scripts/test/smoke_fixtures.py

  # install/uninstall 集成测试（wrapper + PATH marker + completion + skill symlink 注册/清理）。
  # skill symlink 注册段是 2026-08-18 迁入后的新增逻辑，独立 job 守护。
  install-uninstall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test/test_install_uninstall.sh
