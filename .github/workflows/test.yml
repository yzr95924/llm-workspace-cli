name: test

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.20
      - run: ruff format --check .
      - run: ruff check .
      # skill↔CLI 外部契约 gate：skill 文本里的 llmw 命令/flag/finding 名/终态词 与
      # CLI argparse 树 + finding 字面量比对，CLI 代码里的 rule_ref 指针与 skill 小节
      # 比对——语法面漂移即红（语义面行为描述靠 MEMORY 纪律人工保证）。
      - run: python scripts/test/check_skill_cli_contract.py
      # skill 零代码不变量：yzr-llm-*/ 下不得出现 .py（确定性代码全部归 llmw/content/）。
      # SKILL 目录是纯文本（SKILL.md / 模板 / fixtures / workflow 散文）——代码回渗即红。
      - run: |
          find yzr-llm-wiki-management -name '*.py' | grep -q . && { echo 'FAIL: skill 目录出现 .py'; exit 1; } || true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 官方 python 容器提供真实 3.12/3.14 环境，不受 runner 镜像变动影响。
        # 3.12 = 最低支持基线（与外部 docling 工具环境一致），3.14 = 当前版本，
        # 两者都跑 import smoke + 全量 pytest。Docling 为 uv tool 独立安装，不进 CI。
        py: ["3.12", "3.14"]
    container: python:${{ matrix.py }}
    steps:
      - uses: actions/checkout@v4
      # 基础包零第三方依赖；Docling/Torch 等重依赖不进 llmw 环境和常规 CI。
      # 钉 pytest>=8,<9：与 Python 3.12/3.14 的当前支持范围对齐。
      - run: pip install -e . "pytest>=8,<9"
      # import smoke：逐一 import 所有子模块——能抓到 import 期求值的注解破坏；
      # 而 pytest 只 import 被收集的测试文件，覆盖不到 llmw 全部子模块。
      - run: python -c "import importlib,pkgutil,llmw; [importlib.import_module(m.name) for m in pkgutil.walk_packages(llmw.__path__,'llmw.')]; print('import smoke OK')"
      # 全仓 pytest：tests/（含搬入的 llmw.content 测试）。
      - run: pytest -q

  # fresh init + wiki → wiki 探测器（llmw.content 命令面：`llmw wiki --path=DIR check-fixtures`）
  # → 断言结构合规。
  # 双向覆盖：CLI 改坏骨架 / SKILL 改坏 fixtures 都让本 job 红。兑现
  # 探测器是 CLI 产物合规的可执行真源（格式契约与探测器不一致时以探测器为准）。
  # SKILL 与 CLI 同仓，无 submodule 依赖。
  fixtures-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 不需 pip install：gate 脚本内设 PYTHONPATH=REPO，python -m llmw 直接 import。
      - run: python scripts/test/smoke_fixtures.py

  # install/uninstall 集成测试（wrapper + PATH marker + completion + skill symlink 注册/清理）。
  # skill symlink 注册段是 2026-08-18 迁入后的新增逻辑，独立 job 守护。
  install-uninstall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test/test_install_uninstall.sh
