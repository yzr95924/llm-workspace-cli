[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmw"
version = "0.1.0"
description = "Wiki workspace CLI for managing LLM wikis under a single git repo"
requires-python = ">=3.7"
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
llmw = "llmw.cli:main"

[tool.setuptools]
packages = ["llmw", "llmw.workspace", "llmw.wiki", "llmw.models"]

# ruff 全局配置：两 SKILL 目录（yzr-llm-wiki-management / yzr-llm-workspace-management）
# 自带局部 ruff 配置（行宽 120 + 规则族），根配置只声明 target。
[tool.ruff]
# ruff 新版默认开启 preview rules,会扫出 ~90 个新规则错误
# (FA100/I001/UP032/RUF100 等),用于 CI lint 误伤修复。
# 显式关闭 preview,锁住稳定规则集——本地 ruff 0.15.20 与 CI 最新版都生效。
preview = false
target-version = "py37"