[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmw"
version = "0.1.0"
description = "Wiki workspace CLI for managing LLM wikis under a single git repo"
requires-python = ">=3.7"
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
llmw = "llmw.cli:main"

[tool.setuptools]
packages = ["llmw", "llmw.workspace", "llmw.wiki", "llmw.content"]

[tool.setuptools.package-data]
"llmw.content" = ["templates/**/*.md", "templates/**/*.template", "templates/**/gitignore", "legacy_paths.toml"]

[tool.ruff]
# ruff 双配置并存（刻意）：根配置管 CLI 包 + tests（默认规则 E4/E7/E9/F）；
# llmw/content/ruff.toml 局部覆盖该包（120 行宽 + E/W/F/I/B/UP）。
preview = false
target-version = "py37"
