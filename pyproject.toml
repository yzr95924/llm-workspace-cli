[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmw"
version = "0.1.0"
description = "Wiki workspace CLI for managing LLM wikis under a single git repo"
requires-python = ">=3.7"
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
llmw = "llmw.cli:main"

[tool.setuptools]
packages = ["llmw", "llmw.workspace", "llmw.wiki", "llmw.models", "llmw.content"]

[tool.setuptools.package-data]
"llmw.content" = ["templates/**/*.md", "templates/**/*.md.txt", "templates/**/*.template", "templates/**/*.txt"]

[tool.ruff]
# ruff 全局配置：仓库无局部 ruff.toml（CLI 包 + 两 SKILL 目录都无 .py 残留），
# 统一走根配置，只锁 preview + target。
preview = false
target-version = "py37"
